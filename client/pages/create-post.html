<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a story · Wanderly</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/main.js"></script><script defer src="/js/posts.js"></script></head><body data-page="create"><header id="site-header"></header><main class="auth-wrap"><section class="auth-card wide"><span class="eyebrow">YOUR TRAVEL JOURNAL</span><h1>Write a story</h1><p class="muted">Share the details someone else will remember.</p><form id="post-form"><label>Story title<input name="title" maxlength="180" required placeholder="A weekend in the mountains"></label><label>Location<input name="location" maxlength="180" required placeholder="Place, region"></label><label>Travel image<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><small>JPG, PNG, WEBP or GIF · maximum 5 MB</small></label><label>Your story<textarea name="description" rows="8" maxlength="10000" required placeholder="What did you see, taste, and feel?"></textarea></label><p class="form-message" aria-live="polite"></p><button class="button">Publish story ↗</button></form></section></main><footer id="site-footer"></footer></body></html>
