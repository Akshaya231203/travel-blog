<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit story · Wanderly</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/main.js"></script><script defer src="/js/posts.js"></script></head><body data-page="edit-post"><header id="site-header"></header><main class="auth-wrap"><section class="auth-card wide"><span class="eyebrow">YOUR TRAVEL JOURNAL</span><h1>Edit your story</h1><form id="post-form"><label>Story title<input name="title" maxlength="180" required></label><label>Location<input name="location" maxlength="180" required></label><div id="existing-image"></div><label>Replace image (optional)<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>JPG, PNG, WEBP or GIF · maximum 5 MB</small></label><label>Your story<textarea name="description" rows="8" maxlength="10000" required></textarea></label><p class="form-message" aria-live="polite"></p><button class="button">Save changes ↗</button></form></section></main><footer id="site-footer"></footer></body></html>
