<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Wanderly</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/main.js"></script><script defer src="/js/auth.js"></script></head><body data-page="signup"><header id="site-header"></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">START YOUR STORY</span><h1>Join the journey</h1><p class="muted">Create an account and share what you discover.</p><form id="signup-form"><label>Full name<input name="name" maxlength="100" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label><label>Confirm password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><p class="form-message" aria-live="polite"></p><button class="button" type="submit">Create account ↗</button></form><p class="auth-switch">Already a member? <a href="/pages/login.html">Log in</a></p></section></main><footer id="site-footer"></footer></body></html>
